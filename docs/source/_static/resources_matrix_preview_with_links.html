<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Complete Resource Matrix</title>
<style>
:root {
  --border:#d9dee7;
  --head:#f5f7fa;
  --head2:#eef2f7;
  --text:#273142;
  --muted:#667085;
  --accent:#52678a;
  --row-hover:#f8fafc;
  --link:#2d5f95;
}
* {box-sizing:border-box}
body {margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:#fff}
.container {padding:12px 4px 18px}
.intro {margin:0 0 10px;font-size:12px;color:var(--muted)}
.controls {display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
input[type=search] {flex:1 1 320px;max-width:540px;padding:9px 12px;border:1px solid var(--border);border-radius:7px;font-size:14px;color:var(--text);background:#fff}
button {padding:8px 11px;border:1px solid var(--border);border-radius:7px;background:#fff;color:var(--text);cursor:pointer}
button:hover {background:var(--head)}
.status {font-size:13px;color:var(--muted)}
.table-wrap {overflow:auto;max-height:70vh;border:1px solid var(--border);border-radius:8px}
table {border-collapse:separate;border-spacing:0;min-width:max-content;width:100%;font-size:13px}
th,td {padding:8px 10px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);white-space:nowrap;text-align:center;background:#fff}
th {position:sticky;top:0;z-index:4;background:var(--head);font-weight:650;color:#394150;cursor:pointer}
th:hover {background:var(--head2)}
th:first-child,td:first-child {position:sticky;left:0;text-align:left;min-width:340px;max-width:460px;white-space:normal}
th:first-child {z-index:6;background:var(--head);cursor:default}
td:first-child {z-index:2;background:#fff;font-weight:560}
td:first-child a {color:var(--link);text-decoration:none}
td:first-child a:hover {text-decoration:underline}
tbody tr:hover td {background:var(--row-hover)}
tbody tr:hover td:first-child {background:var(--row-hover)}
th:last-child,td:last-child {border-right:0}
tr:last-child td {border-bottom:0}
.mark {font-weight:700;font-size:15px;color:var(--accent)}
th.active {background:#dfe7f2;color:#334155}
.note {margin:8px 0 0;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="container">
  <p class="intro">Click a topic heading to filter the matrix. The Resource column and topic headers remain visible while you scroll.</p>
  <div class="controls">
    <input id="search" type="search" placeholder="Search resources or topics…" aria-label="Search resources or topics">
    <button id="clearSearch" type="button">Clear</button>
    <button id="clearTopic" type="button">Clear topic filter</button>
    <span id="status" class="status"></span>
  </div>
  <div class="table-wrap">
    <table id="matrix" aria-describedby="matrix-note">
      <thead></thead>
      <tbody></tbody>
    </table>
  </div>
  <div id="matrix-note" class="note">All rows and all 17 columns from the source spreadsheet are included. Resource titles become clickable when a URL is supplied in the <code>RESOURCE_URLS</code> object in this file.</div>
</div>
<script>
// ============================================================
// ADD RESOURCE LINKS HERE
// ============================================================
// Replace the empty string for a resource with its URL, e.g.:
// "MRI Questions": "https://example.org/mri-questions",
// You can add/edit URLs without changing the table data below.

                       "IDRE Office Advanced Research Computing Events":"https://oarc.ucla.edu/events",

                       "Cohen Matlab for Neuroscience (YouTube)":"https://www.youtube.com/watch?v=GwcJqv6XsEg",
                       "INCF Matlab for Neuroscience":"https://training.incf.org/collection/essentials-neuroscience-matlab",
                       "IDRE Sagger Topological Analysis (fMRI)":"https://idre.ucla.edu/calendar-event/topological-data-analysis-march-8-2024",
                       "IDRE Spreng PLS & FC (fMRI)":"https://idre.ucla.edu/calendar-event/jason-nomi-9-18-2023",

                       "UMichigan Training in fMRI":"https://courses.lsa.umich.edu/fmri-training-course/",
                       "OHBM 2025 Education":"https://www.youtube.com/playlist?list=PLEJ899jsgdRpAe1o_9nwvmroUYo4kRVSc",
                       "Martin Monti Course Slides":"https://www.youtube.com/@braintalk9664/playlists",
                       "UCLA CCN Prior Workshops":"https://staglincenterforcogneuro.semel.ucla.edu/data-analysis-workshops",
                       "Mumford Brain Stats (YouTube)":"https://www.youtube.com/@mumfordbrainstats",
                       "Mumford Brain Stats (tumblr)":"https://mumfordbrainstats.tumblr.com/",
                       "FSL course (YouTube)":"https://www.youtube.com/c/FSLCourse",
                       "FSL course website":"https://open.oxcin.ox.ac.uk/pages/fslcourse/website/index.html",
                       "SPM course website":"https://www.fil.ion.ucl.ac.uk/spm/course/",
                       "AFNI course videos (YouTube)":"https://www.youtube.com/c/afnibootcamp",
                       "Clinical Neuroanatomy Seminars (YouTube)":"https://www.youtube.com/@CNSeminars",
                       "Online EEGLAB workshop":"https://eeglab.org/workshops/Online_EEGLAB_Workshop.html",
                       "Online Fieldtrip workshop videos":"https://www.fieldtriptoolbox.org/video/",
                       "Online Brainstorm EEG tutorial":"https://neuroimage.usc.edu/brainstorm/",
                       "Online MNE EEG/MEG tutorial":"https://mne.tools/stable/auto_tutorials/intro/10_overview.html",
                       "CuttingEEG EEG/MEG workshops & community":"https://cuttingeeg.org/"};

const DATA = {"headers":["Resource","MRI Data Acq.","MRI Data PreProc","MRI Data Analysis","EEG Data Acq.","EEG Data PreProc","EEG Data Analysis","Other (anatomy etc)","HPC","Unix/Bash","Python","R","Matlab","Other Computing","Online course","UCLA workshop","UCLA course"],
              "rows":[["Institute for Quantitative & Computational Biosciences",null,null,null,null,null,null,null,"X","X","X","X","X","X","X",null,null],["IDRE Office Advanced Research Computing Events",null,null,null,null,null,null,null,"X","X","X","X","X","X",null,null,null],["Mike X Cohen, Matlab, Python, Signal Processing in Neuroscience",null,null,null,null,"X","X",null,null,null,"X",null,"X","X",null,null,null],["Andy's Brain Book",null,"X","X",null,null,null,null,"X","X","X",null,"X",null,null,null,null],["Better code better science",null,null,null,null,null,null,null,null,null,"X",null,null,"X",null,null,null],["Cohen Matlab for Neuroscience (YouTube)",null,null,null,null,null,null,null,null,null,null,null,"X",null,null,null,null],["INCF Matlab for Neuroscience",null,null,null,null,null,null,null,null,null,null,null,"X",null,null,null,null],["IDRE Sagger Topological Analysis (fMRI)",null,null,"X",null,null,null,null,null,null,null,null,null,null,null,"X",null],["IDRE Spreng PLS & FC (fMRI)",null,null,"X",null,null,null,null,null,null,null,null,null,null,null,"X",null],["ABCD ReproNim",null,null,null,null,null,null,null,null,null,null,null,null,"X","X",null,null],["NIH fMRIF Summer Course","X",null,"X",null,null,null,null,null,null,null,null,null,null,"X",null,null],["MRI Questions","X",null,null,null,null,null,null,null,null,null,null,null,null,null,null,null],["John Hopkins Principles of fMRI  Coursera","X","X","X",null,null,null,null,null,null,null,null,null,null,"X",null,null],["UMichigan Training in fMRI","X","X","X",null,null,null,null,null,null,null,null,null,null,null,null,null],["OHBM 2025 Education",null,"X","X",null,null,null,null,null,null,null,null,null,null,null,null,null],["Martin Monti Course Slides",null,"X","X",null,null,null,null,null,null,null,null,null,null,null,null,"X"],["UCLA CCN Prior Workshops",null,"X","X",null,null,null,null,null,null,null,null,null,null,null,null,null],["Mumford Brain Stats (YouTube)",null,null,"X",null,null,null,null,null,null,"X",null,null,"X",null,null,null],["Mumford Brain Stats (tumblr)",null,null,"X",null,null,null,null,null,null,null,null,null,null,null,null,null],["FSL course (YouTube)","X","X","X",null,null,null,null,null,null,null,null,null,null,null,null,null],["FSL course website","X","X","X",null,null,null,null,null,null,null,null,null,null,null,null,null],["SPM course website","X","X","X",null,null,null,null,null,null,null,null,null,null,null,null,null],["AFNI course videos (YouTube)","X","X","X",null,null,null,null,null,null,null,null,null,null,null,null,null],["Clinical Neuroanatomy Seminars (YouTube)",null,null,null,null,null,null,"X",null,null,null,null,null,null,null,null,null],["Online EEGLAB workshop",null,null,null,"X","X","X",null,null,null,null,null,null,null,null,null,null],["Online Fieldtrip workshop videos",null,null,null,"X","X","X",null,null,null,null,null,null,null,null,null,null],["Online Brainstorm EEG tutorial",null,null,null,"X","X","X",null,null,null,null,null,null,null,null,null,null],["Online MNE EEG/MEG tutorial",null,null,null,"X","X","X",null,null,null,null,null,null,null,null,null,null],["CuttingEEG EEG/MEG workshops & community",null,null,null,null,"X","X",null,null,null,null,null,null,null,"X",null,null]]};
const headers=DATA.headers, rows=DATA.rows;
let topicFilter=null;
const thead=document.querySelector('#matrix thead'), tbody=document.querySelector('#matrix tbody'), search=document.querySelector('#search'), status=document.querySelector('#status');

function buildHeader() {
  const tr=document.createElement('tr');
  headers.forEach((h,i)=>{
    const th=document.createElement('th');
    th.textContent=h||'';
    th.dataset.col=i;
    if(i>0){
      th.title='Click to filter to resources covering '+h;
      th.addEventListener('click',()=>{topicFilter=topicFilter===i?null:i;render()});
    }
    tr.appendChild(th);
  });
  thead.appendChild(tr);
}

function makeResourceCell(name) {
  const td=document.createElement('td');
  const url=RESOURCE_URLS[name]||'';
  if(url) {
    const a=document.createElement('a');
    a.href=url;
    a.target='_blank';
    a.rel='noopener noreferrer';
    a.textContent=name;
    td.appendChild(a);
  } else {
    td.textContent=name;
  }
  return td;
}

function render() {
  const q=search.value.trim().toLowerCase();
  tbody.innerHTML='';
  let visible=0;
  rows.forEach(row=>{
    const resource=String(row[0]??'');
    const searchable=(resource+' '+headers.slice(1).filter((_,i)=>row[i+1]==='X').join(' ')).toLowerCase();
    const matchesSearch=!q||searchable.includes(q);
    const matchesTopic=topicFilter===null||row[topicFilter]==='X';
    if(!matchesSearch||!matchesTopic) return;
    visible++;
    const tr=document.createElement('tr');
    tr.appendChild(makeResourceCell(resource));
    for(let i=1;i<headers.length;i++){
      const td=document.createElement('td');
      if(row[i]==='X'){
        const s=document.createElement('span');
        s.className='mark';
        s.textContent='X';
        td.appendChild(s);
      }
      tr.appendChild(td);
    }
    tbody.appendChild(tr);
  });
  status.textContent=`${visible} of ${rows.length} resources shown`;
  document.querySelectorAll('#matrix th').forEach(th=>th.classList.toggle('active',Number(th.dataset.col)===topicFilter));
}

search.addEventListener('input',render);
document.querySelector('#clearSearch').addEventListener('click',()=>{search.value='';render();search.focus()});
document.querySelector('#clearTopic').addEventListener('click',()=>{topicFilter=null;render()});
buildHeader();
render();
</script>
</body>
</html>
